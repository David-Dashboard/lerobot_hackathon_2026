name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Create env + install deps
        run: |
          uv venv --python 3.11
          uv pip install "lerobot[feetech]" rerun-sdk pytest

      - name: Run tests (no hardware, no dataset download)
        env:
          SKIP_DATASET_TESTS: "1"   # skip the 80MB dataset pull in CI; runs locally
        run: .venv/bin/python -m pytest
